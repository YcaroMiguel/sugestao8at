<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caixinha de Ideias – 8º AT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>💡 Caixinha de Ideias – 8º AT</h1>
    <p>Escreva aqui qualquer ideia, sugestão ou crítica construtiva para melhorar a nossa turma. Sua opinião é importante!</p>
    
    <form action="https://formsubmit.co/miguelnegocios001@gmail.com" method="POST">
      <input type="hidden" name="_next" value="https://ycaromiguel.github.io/sugestao8at/thanks.html">
      <input type="hidden" name="_captcha" value="false">

      <label for="nome">Seu nome (opcional)</label>
      <input type="text" id="nome" name="nome" placeholder="Por gentileza, coloque seu nome">

      <label for="categoria">Categoria</label>
      <select id="categoria" name="categoria" required>
        <option value="" disabled selected>Selecione uma opção</option>
        <option value="sugestao">Sugestão</option>
        <option value="ideia">Ideia</option>
        <option value="critica">Crítica construtiva</option>
      </select>

      <label for="mensagem">Escreva sua mensagem</label>
      <textarea id="mensagem" name="mensagem" rows="6" required placeholder="Escreva aqui..."></textarea>

      <button type="submit">✉️ Enviar</button>
    </form>
  </div>
</body>
</html>
